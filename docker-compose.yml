name: applicient

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applicient}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applicient}
      POSTGRES_DB: ${POSTGRES_DB:-applicient}
    ports:
      # Bound to 127.0.0.1 — this only needs to be reachable from the
      # host machine itself (e.g. `psql` over an SSH tunnel), never from
      # the public internet. Docker's own iptables rules bypass ufw for
      # a plain 0.0.0.0 publish, so the loopback bind is the real
      # boundary here, not the host firewall. Override POSTGRES_PORT
      # when the host already uses 5433.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applicient} -d ${POSTGRES_DB:-applicient}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      # See postgres's port comment — loopback-only, not public.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Official minio/minio archived April 2026 — this is the last verified
    # official tag. Fine for local dev; production swaps to real S3 (PRD §8.2).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-applicient}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-applicient-dev-only}
    ports:
      # See postgres's port comment — loopback-only, not public.
      - "127.0.0.1:${S3_PORT:-9000}:9000"   # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Local dev: `docker compose build` builds from the Dockerfile above
    # and tags the result with this name — the `image:` line doesn't
    # change that. Production: CI builds+pushes this exact tag to Docker
    # Hub (see .github/workflows/deploy.yml) and the VPS just `docker
    # compose pull`s it, never building on the box itself.
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/applicient-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # These service names work inside the Compose network. The values
      # can still be overridden from an optional root .env file.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-applicient}:${POSTGRES_PASSWORD:-applicient}@postgres:5432/${POSTGRES_DB:-applicient}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-applicient}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-applicient-dev-only}
      S3_BUCKET: ${S3_BUCKET:-applicient}
      # SaaS pivot — no default fallback: a shared, checked-into-the-repo
      # key would decrypt every tenant's provider keys/Gmail tokens for
      # anyone who's ever read this file. Generate your own (.env.example
      # has the command) — the api container now fails fast at startup
      # (main.py's _require_secret_key) if this is unset, rather than
      # booting fine and breaking on the first encrypted-field access.
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-applicient}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-applicient-dev}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-demo@applicient.local}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      GOOGLE_LOGIN_REDIRECT_URI: ${GOOGLE_LOGIN_REDIRECT_URI:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_PAYMENTS_ENVIRONMENT: ${DODO_PAYMENTS_ENVIRONMENT:-test_mode}
      DODO_PAYMENTS_WEBHOOK_KEY: ${DODO_PAYMENTS_WEBHOOK_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:${API_PORT:-8000}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${WEB_PORT:-3000}}
      BROWSER_WORKER_URL: http://browser-worker:8100
    ports:
      # Loopback-only: caddy reaches this over the compose network
      # (http://api:8000), it never needs the host-published port.
      # Kept published for host-side debugging (curl/SSH tunnel).
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  browser-worker:
    build:
      context: ./browser-worker
    # See api's image comment — same build-locally/pull-in-prod split.
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/applicient-browser-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Each open session is a real Chromium process — cap it to what
      # the host actually has RAM for. Default (sessions.py) is 20,
      # which assumes a much bigger box than a typical starter VPS;
      # see DEPLOYMENT.md for sizing guidance.
      BROWSER_WORKER_MAX_SESSIONS: ${BROWSER_WORKER_MAX_SESSIONS:-20}
    # Chromium's default /dev/shm (64MB) is too small under Docker and
    # can crash mid-session — same fix Playwright's own Docker docs
    # recommend.
    shm_size: "1gb"
    ports:
      # Loopback-only — internal service, api reaches it as
      # http://browser-worker:8100 over the compose network.
      - "127.0.0.1:${BROWSER_WORKER_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        # Baked into the client bundle at build time — this has to be
        # the browser-reachable address (the api service's published
        # host port), not the in-network "http://api:8000" the web
        # container itself would use.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}"
        NEXT_PUBLIC_DODO_PAYMENTS_MODE: "${NEXT_PUBLIC_DODO_PAYMENTS_MODE:-test}"
    # See api's image comment — same build-locally/pull-in-prod split.
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/applicient-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Server-only (metadataBase/robots.txt/sitemap.xml generation,
      # layout.tsx/robots.ts/sitemap.ts — none of it client-bundled),
      # so this is a plain runtime var, not a NEXT_PUBLIC_ build ARG
      # like the two above — changing it doesn't need a rebuild.
      SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-3000}}
    ports:
      # Loopback-only — caddy reaches this as http://web:3000 over the
      # compose network; see api's port comment.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # TLS-terminating reverse proxy, production only (`docker compose
  # --profile prod up -d`, or `docker compose up -d caddy` explicitly —
  # left out of a plain `docker compose up` so local dev is unaffected).
  # Auto-obtains/renews Let's Encrypt certs for the domains listed in
  # ./Caddyfile — see DEPLOYMENT.md. Deliberately no `depends_on: [web,
  # api]` — Caddy doesn't need them present at its own startup (it just
  # 502s per-request until they're up), and DEPLOYMENT.md's step 6
  # relies on bringing Caddy up completely standalone, before `web`/`api`
  # exist at all. A depends_on here would drag those (and
  # browser-worker) into `docker compose up -d caddy` too.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: ["prod"]
    environment:
      # Caddyfile's `email {$CADDY_EMAIL}` needs a syntactically valid
      # address even before the real one exists (step 6 brings Caddy up
      # before step 7's .env exists at all) — an empty substitution turns
      # that into a bare `email` directive with no argument, which is a
      # Caddyfile parse error and crash-loops the container. This
      # placeholder is functionally fine either way: Let's Encrypt
      # doesn't validate deliverability at issuance, it's only used for
      # optional expiry notices.
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@applicient.my.id}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  # --- Not yet built: still empty stub packages (see worker/,
  # scheduler/, metering/, models/) — nothing to containerize until
  # one of those actually has code in it.

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:

name: applicient

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applicient}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applicient}
      POSTGRES_DB: ${POSTGRES_DB:-applicient}
    ports:
      # Host port 5433, not 5432 — this machine already runs a native
      # Homebrew postgresql@14 service bound to 127.0.0.1:5432/[::1]:5432,
      # and macOS resolves "localhost" to that one first. Remapping here
      # avoids the collision without touching the existing service.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applicient} -d ${POSTGRES_DB:-applicient}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Official minio/minio archived April 2026 — this is the last verified
    # official tag. Fine for local dev; production swaps to real S3 (PRD §8.2).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-applicient}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-applicient-dev-only}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Application services: uncommented as each is scaffolded ---
  # See docs/IMPLEMENTATION.md for build order.

  # api:
  #   build: ./api
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  # worker:
  #   build: ./worker
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  # browser-worker:
  #   build: ./browser-worker
  #   env_file: .env
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #
  # web:
  #   build: ./web
  #   env_file: .env
  #   ports:
  #     - "3000:3000"

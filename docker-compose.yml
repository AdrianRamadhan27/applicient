name: applicient

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applicient}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applicient}
      POSTGRES_DB: ${POSTGRES_DB:-applicient}
    ports:
      # Override POSTGRES_PORT when the host already uses 5433.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applicient} -d ${POSTGRES_DB:-applicient}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Official minio/minio archived April 2026 — this is the last verified
    # official tag. Fine for local dev; production swaps to real S3 (PRD §8.2).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-applicient}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-applicient-dev-only}
    ports:
      - "${S3_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      # These service names work inside the Compose network. The values
      # can still be overridden from an optional root .env file.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-applicient}:${POSTGRES_PASSWORD:-applicient}@postgres:5432/${POSTGRES_DB:-applicient}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-applicient}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-applicient-dev-only}
      S3_BUCKET: ${S3_BUCKET:-applicient}
      # Development-only fallback so a fresh clone can save a provider
      # connection without first generating a Fernet key. Replace this
      # for any shared or non-local deployment.
      SECRET_KEY: ${SECRET_KEY:-3bvqp75gEt7Wq7cMXtIedPE-zZEGVCpbUL0DVOqZN0Y=}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-applicient}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-applicient-dev}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${WEB_PORT:-3000}}
      BROWSER_WORKER_URL: http://browser-worker:8100
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  browser-worker:
    build:
      context: ./browser-worker
    restart: unless-stopped
    # Chromium's default /dev/shm (64MB) is too small under Docker and
    # can crash mid-session — same fix Playwright's own Docker docs
    # recommend.
    shm_size: "1gb"
    ports:
      - "${BROWSER_WORKER_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        # Baked into the client bundle at build time — this has to be
        # the browser-reachable address (the api service's published
        # host port), not the in-network "http://api:8000" the web
        # container itself would use.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- Not yet built: still empty stub packages (see worker/,
  # scheduler/, metering/, models/) — nothing to containerize until
  # one of those actually has code in it.

volumes:
  pgdata:
  redisdata:
  miniodata:

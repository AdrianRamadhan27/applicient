[project]
name = "applicient-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adrianramadhan-strait", email = "adrian.ramadhan@straitpoint.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "applicient-sources",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.6",
    "langchain-openai>=1.5.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
applicient-api = "applicient_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.uv.sources]
# M1 §3 — the radar-run orchestrator (this package) is the actual
# caller of get_adapter()/SourceAdapter; the dependency direction was
# backwards before (sources/pyproject.toml declared applicient-api as
# a dependency it never actually imported — checked, zero real
# imports, comments only). Flipped to match real usage instead of
# leaving a circular declaration neither side needs.
applicient-sources = { path = "../sources", editable = true }

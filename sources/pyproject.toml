[project]
name = "applicient-sources"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adrianramadhan-strait", email = "adrian.ramadhan@straitpoint.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-jobspy>=1.1.82",
]

[project.scripts]
applicient-sources = "applicient_sources:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits a real network endpoint — opt-in only, never runs in CI by default",
]

[project]
name = "browser-worker"
version = "0.1.0"
description = "Isolated Playwright worker — persistent browser contexts, form introspection, live handoff screencast (PRD §8.1/§8.3)"
readme = "README.md"
authors = [
    { name = "adrianramadhan-strait", email = "adrian.ramadhan@straitpoint.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "playwright>=1.59.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "websockets>=13.1",
]

[project.scripts]
browser-worker = "browser_worker:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "websockets>=17.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
